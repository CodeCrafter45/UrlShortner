<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">

    <!-- CSS will be added later -->
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="logo">🔗 Sniply</div>
</header>

<!-- Main Content -->
<main class="container">

    <h1 class="heading">Shorten Your Long URLs</h1>
    <p class="description">
        Paste a long link below and get a short, shareable URL in seconds.
    </p>

    <!-- Input Section -->
    <div class="input-section">
        <input
                type="url"
                id="urlInput"
                placeholder="Enter your long URL here..."
                required
        />
        <button id="shortenBtn">Shorten</button>
    </div>

    <p id="errorMessage" class="error-message" hidden></p>

    <!-- Result Section (hidden until a URL is shortened) -->
    <div class="result-section" id="resultSection" hidden>
        <p class="result-label">Your shortened URL:</p>
        <div class="result-box">
            <span id="shortUrl"></span>
            <button id="copyBtn">Copy</button>
        </div>
    </div>

    <!-- Analytics Dashboard -->
    <section class="stats-section">
        <div class="stats-header">
            <h2>Sniply Analytics</h2>
            <button id="loadStatsBtn" class="refresh-btn">
                ⟳ Refresh
            </button>
        </div>

        <div class="stats-cards">
            <div class="card">
                <p>Total URLs</p>
                <h3 id="totalUrls">0</h3>
            </div>

            <div class="card">
                <p>Total Clicks</p>
                <h3 id="totalClicks">0</h3>
            </div>

            <div class="card">
                <p>Top Short Code</p>
                <h3 id="topCode">--</h3>
            </div>
        </div>

        <table class="stats-table">
            <thead>
            <tr>
                <th>Short Code</th>
                <th>Original URL</th>
                <th>Clicks</th>
            </tr>
            </thead>

            <tbody id="statsBody"></tbody>
        </table>
    </section>

</main>
<script src="script.js"></script>
</body>
</html>
