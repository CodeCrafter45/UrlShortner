

services:

    mysql:
      image: mysql:8.0
      container_name: sniply-mysql
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: student12345
        MYSQL_DATABASE: url_shortener
      ports:
        - "3307:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pstudent12345" ]
        interval: 10s
        timeout: 5s
        retries: 10


    app:
      build: .
      container_name: sniply-app
      depends_on:
        mysql:
          condition: service_healthy
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_shortener
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: student12345
        APP_BASE_URL: http://localhost:8080

volumes:
  mysql_data: